<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form action="" method="post">
		<label for="name">Name:</label>
		<input type="text" id="name" placeholder="Name" required ><br><br>

		<label for="email">Email:</label>
		<input type="email" id="email" placeholder="Email" required><br><br>

	    <label for="gender_m">Male:</label>
		<input type="Radio" id="gender_m" name="gender" required><br><br>

		<label for="gender_f">Female:</label>
		<input type="Radio" id="gender_f" name="gender" required><br><br>

		<label for="cars">Car Brands:</label>
		<select id="cars" required>
		<option value="" disabled selected >--Please choose an option--</option>
			 <option value="BMW">BMW</option>
			 <option value="Mercedes">Mercedes</option>
			 <option value="Scoda">Scoda</option>
		</select><br><br>

		<label for="age">Age:</label>
		<input type="Number" id="age" placeholder="Age" required><br><br>

		<label for="dob">DOB</label>
		<input type="Date" id="dob" required><br><br>

		<label for="tel" >Phone Number</label>
		<input type="Tel" id="tel" placeholder="xxx-xxx-xxxx" ><br><br>

		<label for="password" >Password:</label>
		<input type="Password" id="password" placeholder="Password" required><br><br>

		<label for="tos">I agree to the TOS:</label>
		<input type="Checkbox" id="tos" required><br><br>

		<button type="submit">submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
